name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: 'Coverage (CP12 expanded: >60% on lib/ + app/api/ + app/actions.ts with per-file gates)'
        run: npm run test:coverage

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/vsis
      AUTH_SECRET: placeholder-secret-at-least-32-chars-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck + build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vsis
          POSTGRES_PASSWORD: vsispassword123
          POSTGRES_DB: vsis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vsis -d vsis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://vsis:vsispassword123@localhost:5432/vsis_test
      TEST_DATABASE_URL: postgres://vsis:vsispassword123@localhost:5432/vsis_test
      AUTH_SECRET: test-auth-secret-key-at-least-32-bytes-long!
      RATE_LIMIT_SUBJECT_SECRET: test-rate-limit-subject-secret-32-bytes!
      ADMIN_EMAIL: admin@vsis.lk
      ADMIN_PASSWORD: AdminPassword123!
      E2E_EMAIL: admin@vsis.lk
      E2E_PASSWORD: AdminPassword123!
      E2E_PENDING_EMAIL: deactivated@vsis.lk
      E2E_PENDING_PASSWORD: MatrixPassword123!
      # Ephemeral CI server is directly exposed (no reverse proxy); acknowledge
      # it explicitly so the production startup validator boots instead of
      # refusing. Never set this for real deployments.
      ALLOW_UNTRUSTED_CLIENT_IP: "true"
      # The live-HTTP benchmark authenticates through the mobile API and
      # generates per-request X-Forwarded-For identities for rate-limit buckets.
      MOBILE_BEARER_AUTH_ENABLED: "true"
      MOBILE_AUTH_SECRET: ci-mobile-auth-secret-32-bytes-long!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run migrations
        run: npm run db:migrate
      - name: Seed base data
        run: npm run db:seed
      - name: Seed deterministic E2E matrix
        run: node scripts/seed-deterministic-matrix.mjs
      - name: Verify E2E fixtures
        run: node scripts/verify-e2e-fixtures.mjs
      - name: Targeted database integration tests
        run: >-
          npx vitest run --no-file-parallelism
          tests/idempotency.int.test.ts
          tests/restore.int.test.ts
          tests/sum-hours.int.test.ts
          tests/password-change-race.int.test.ts
          tests/parity-tracer.test.ts
        env:
          CI: true
      - name: Database integration/concurrency tests
        run: npm run db:concurrency-test
        env:
          CI: true
      - name: Password-recovery database integration tests
        run: npm run db:password-recovery-test
        env:
          CI: true
      - name: Re-align deterministic test matrix
        run: |
          npm run db:seed
          node scripts/seed-deterministic-matrix.mjs
          node scripts/verify-e2e-fixtures.mjs
      - name: Build Next.js
        run: npm run build
      - name: Performance regression budgets (module)
        run: npm run benchmark
      - name: Performance regression budgets (live HTTP)
        env:
          # The benchmark server is addressed directly, so its single connection
          # counts as one trusted proxy hop; without this the X-Forwarded-For
          # identities generated by the benchmark are ignored and every request
          # collapses into the shared direct-client rate-limit bucket.
          TRUSTED_PROXY_HOPS: "1"
        run: |
          node -e "require('@next/env').loadEnvConfig(process.cwd()); require('./.next/standalone/server.js')" &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -s -f http://127.0.0.1:3000/api/health > /dev/null; then
              echo "Server is ready on port 3000."
              break
            fi
            sleep 1
          done
          npm run benchmark:http
          kill $SERVER_PID || true
      - name: Run Playwright E2E
        run: npm run e2e
        env:
          CI: true
      - name: Run Playwright Accessibility audit
        run: npm run a11y
        env:
          CI: true
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t vsis-timesheet:ci .

  mobile-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Mobile lint
        working-directory: mobile
        run: npm run lint
      - name: Mobile typecheck
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Mobile tests
        working-directory: mobile
        run: npm test

  # The dashboard SSR spec needs a real seeded server with a real login, so it
  # runs against the deployed dev site. It tests what ts-dev serves, not this
  # commit. Credentials live in the Preview environment.
  e2e-dev:
    runs-on: ubuntu-latest
    environment: Preview
    env:
      CI: true
      E2E_BASE_URL: https://ts-dev.kst.st
      E2E_EMAIL: ${{ vars.E2E_DEV_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_DEV_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run dashboard SSR E2E against ts-dev
        run: npx playwright test e2e/dashboard-ssr.spec.ts
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-ts-dev
          path: test-results/
          retention-days: 7
