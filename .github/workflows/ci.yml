name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BACKEND: supabase
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: 'Coverage (CP12 expanded: >60% on lib/ + app/api/ + app/actions.ts with per-file gates)'
        run: npm run test:coverage

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - mode: supabase
            NEXT_PUBLIC_BACKEND: supabase
            NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
            SUPABASE_AUTH_CONFIG_CHECK: skip
            DATABASE_URL: ''
            AUTH_SECRET: ''
          - mode: native
            NEXT_PUBLIC_BACKEND: native
            NEXT_PUBLIC_SUPABASE_URL: ''
            NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
            DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/vsis
            AUTH_SECRET: placeholder-secret-at-least-32-chars-long
    env:
      NEXT_PUBLIC_BACKEND: ${{ matrix.NEXT_PUBLIC_BACKEND }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ matrix.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ matrix.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      # This matrix is compile-only and has no provider. The e2e Supabase leg
      # below runs the mandatory gate against the live local Auth service.
      SUPABASE_AUTH_CONFIG_CHECK: ${{ matrix.SUPABASE_AUTH_CONFIG_CHECK }}
      DATABASE_URL: ${{ matrix.DATABASE_URL }}
      AUTH_SECRET: ${{ matrix.AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck + build (${{ matrix.mode }})
        run: npm run build

  e2e-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: native
            NEXT_PUBLIC_BACKEND: native
            NEXT_PUBLIC_SUPABASE_URL: ''
            NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
            SUPABASE_SERVICE_ROLE_KEY: ''
          - backend: supabase
            NEXT_PUBLIC_BACKEND: supabase
            NEXT_PUBLIC_SUPABASE_URL: ''
            NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
            SUPABASE_SERVICE_ROLE_KEY: ''
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vsis
          POSTGRES_PASSWORD: vsispassword123
          POSTGRES_DB: vsis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://vsis:vsispassword123@localhost:5432/vsis_test
      TEST_DATABASE_URL: postgres://vsis:vsispassword123@localhost:5432/vsis_test
      AUTH_SECRET: test-auth-secret-key-at-least-32-bytes-long!
      RATE_LIMIT_SUBJECT_SECRET: test-rate-limit-subject-secret-32-bytes!
      ADMIN_EMAIL: admin@vsis.lk
      ADMIN_PASSWORD: AdminPassword123!
      E2E_EMAIL: admin@vsis.lk
      E2E_PASSWORD: AdminPassword123!
      E2E_PENDING_EMAIL: deactivated@vsis.lk
      E2E_PENDING_PASSWORD: MatrixPassword123!
      NEXT_PUBLIC_BACKEND: ${{ matrix.NEXT_PUBLIC_BACKEND }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ matrix.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ matrix.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ matrix.SUPABASE_SERVICE_ROLE_KEY }}
      # Ephemeral CI server is directly exposed (no reverse proxy); acknowledge
      # it explicitly so the production startup validator boots instead of
      # refusing. Never set this for real deployments.
      ALLOW_UNTRUSTED_CLIENT_IP: "true"
      # The live-HTTP benchmark authenticates through the mobile API and
      # generates per-request X-Forwarded-For identities for rate-limit buckets.
      MOBILE_BEARER_AUTH_ENABLED: "true"
      MOBILE_AUTH_SECRET: ci-mobile-auth-secret-32-bytes-long!
      # Native signing secret for the mobile JWT mint; the supabase leg uses
      # the HS256 signing key configured below.
      SUPABASE_MOBILE_SIGNING_KEY_ID: ci-benchmark
      SUPABASE_MOBILE_SIGNING_ALG: HS256
      SUPABASE_MOBILE_SIGNING_KEY: ci-supabase-mobile-signing-key-32-bytes!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Start local Supabase stack (supabase)
        if: matrix.backend == 'supabase'
        run: |
          npx supabase start
          npx supabase status -o env > supabase.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' supabase.env | cut -d '=' -f2- | tr -d '\"')" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' supabase.env | cut -d '=' -f2- | tr -d '\"')" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' supabase.env | cut -d '=' -f2- | tr -d '\"')" >> $GITHUB_ENV
          echo "DATABASE_URL=$(grep '^DB_URL=' supabase.env | cut -d '=' -f2- | tr -d '\"')" >> $GITHUB_ENV
          echo "TEST_DATABASE_URL=$(grep '^DB_URL=' supabase.env | cut -d '=' -f2- | tr -d '\"')" >> $GITHUB_ENV
      - name: Rebuild the database from migration 1 (supabase)
        if: matrix.backend == 'supabase'
        run: |
          # Proves the repository can reconstruct the database from zero:
          # db reset drops it and re-applies every file from the first version.
          # The verifier then checks both recorded versions and terminal schema
          # invariants. Published migrations stay immutable; additive, guarded
          # compatibility shims make their original SQL reconstructable.
          npx supabase db reset
          node scripts/verify-supabase-migration-history.mjs
      - name: Run migrations (native)
        if: matrix.backend == 'native'
        run: npm run db:migrate
      - name: Seed deterministic test matrix (native)
        if: matrix.backend == 'native'
        run: node scripts/seed-deterministic-matrix.mjs
      - name: Seed admin (native)
        if: matrix.backend == 'native'
        run: npm run db:seed
      - name: Exercise custom-domain seeding (supabase)
        if: matrix.backend == 'supabase'
        env:
          # Exercises the whitelist-before-Auth ordering for a non-vsis.lk
          # fixture. Runs FIRST: the deterministic seed below leaves
          # admin@vsis.lk on the job-wide E2E_PASSWORD the browser matrix signs
          # in with, because the seed assigns E2E_PASSWORD only to the account
          # named by E2E_EMAIL.
          E2E_EMAIL: matrix.e2e@matrix-fixture.test
        run: node scripts/seed-supabase-matrix.mjs
      - name: Seed Supabase Auth & profiles (supabase)
        if: matrix.backend == 'supabase'
        run: node scripts/seed-supabase-matrix.mjs
      - name: Targeted database integration tests (native)
        if: matrix.backend == 'native'
        run: >-
          npx vitest run --no-file-parallelism
          tests/idempotency.int.test.ts
          tests/restore.int.test.ts
          tests/sum-hours.int.test.ts
          tests/password-change-race.int.test.ts
          tests/parity-tracer.test.ts
        env:
          CI: true
      - name: Database integration/concurrency tests (native)
        if: matrix.backend == 'native'
        run: npm run db:concurrency-test
        env:
          CI: true
      - name: Password-recovery database integration tests (native)
        if: matrix.backend == 'native'
        run: npm run db:password-recovery-test
        env:
          CI: true
      - name: Live Supabase RLS & RPC verification (supabase)
        if: matrix.backend == 'supabase'
        run: >-
          npx vitest run --no-file-parallelism
          tests/supabase-live-rls.int.test.ts
          tests/supabase-live-registration.int.test.ts
        env:
          CI: true
          # This step is the live RLS evidence gate: missing prerequisites must
          # fail setup (naming them) instead of producing a skipped success.
          SUPABASE_LIVE_REQUIRED: "true"
      - name: Re-align deterministic test matrix (native)
        if: matrix.backend == 'native'
        run: |
          node scripts/seed-deterministic-matrix.mjs
          npm run db:seed
      - name: Build Next.js (${{ matrix.backend }})
        run: npm run build
      - name: Performance regression budgets (module)
        run: npm run benchmark
      - name: Performance regression budgets (live HTTP)
        env:
          # The benchmark server is addressed directly, so its single connection
          # counts as one trusted proxy hop; without this the X-Forwarded-For
          # identities generated by the benchmark are ignored and every request
          # collapses into the shared direct-client rate-limit bucket.
          TRUSTED_PROXY_HOPS: "1"
        run: |
          node -e "require('@next/env').loadEnvConfig(process.cwd()); require('./.next/standalone/server.js')" &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -s -f http://127.0.0.1:3000/api/health > /dev/null; then
              echo "Server is ready on port 3000."
              break
            fi
            sleep 1
          done
          npm run benchmark:http
          kill $SERVER_PID || true
      - name: Run Playwright E2E (${{ matrix.backend }})
        run: npm run e2e
        env:
          CI: true
      - name: Run Playwright Accessibility audit (${{ matrix.backend }})
        run: npm run a11y
        env:
          CI: true

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t vsis-timesheet:ci .

  mobile-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Mobile lint
        working-directory: mobile
        run: npm run lint
      - name: Mobile typecheck
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Mobile tests
        working-directory: mobile
        run: npm test
