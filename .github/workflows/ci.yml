name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: 'Coverage (CP12 expanded: >60% on lib/ + app/api/ + app/actions.ts with per-file gates)'
        run: npm run test:coverage

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - mode: supabase
            NEXT_PUBLIC_BACKEND: supabase
            NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
            DATABASE_URL: ''
            AUTH_SECRET: ''
          - mode: native
            NEXT_PUBLIC_BACKEND: native
            NEXT_PUBLIC_SUPABASE_URL: ''
            NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
            DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/vsis
            AUTH_SECRET: placeholder-secret-at-least-32-chars-long
    env:
      NEXT_PUBLIC_BACKEND: ${{ matrix.NEXT_PUBLIC_BACKEND }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ matrix.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ matrix.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      DATABASE_URL: ${{ matrix.DATABASE_URL }}
      AUTH_SECRET: ${{ matrix.AUTH_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck + build (${{ matrix.mode }})
        run: npm run build

  e2e-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - backend: native
            NEXT_PUBLIC_BACKEND: native
            NEXT_PUBLIC_SUPABASE_URL: ''
            NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
            SUPABASE_SERVICE_ROLE_KEY: ''
          - backend: supabase
            NEXT_PUBLIC_BACKEND: supabase
            NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:5432
            NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key-placeholder
            SUPABASE_SERVICE_ROLE_KEY: test-service-role-key-placeholder
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vsis
          POSTGRES_PASSWORD: vsispassword123
          POSTGRES_DB: vsis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://vsis:vsispassword123@localhost:5432/vsis_test
      TEST_DATABASE_URL: postgres://vsis:vsispassword123@localhost:5432/vsis_test
      AUTH_SECRET: test-auth-secret-key-at-least-32-bytes-long!
      RATE_LIMIT_SUBJECT_SECRET: test-rate-limit-subject-secret-32-bytes!
      ADMIN_EMAIL: admin@vsis.lk
      ADMIN_PASSWORD: AdminPassword123!
      E2E_EMAIL: admin@vsis.lk
      E2E_PASSWORD: AdminPassword123!
      E2E_PENDING_EMAIL: deactivated@vsis.lk
      E2E_PENDING_PASSWORD: MatrixPassword123!
      NEXT_PUBLIC_BACKEND: ${{ matrix.NEXT_PUBLIC_BACKEND }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ matrix.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ matrix.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ matrix.SUPABASE_SERVICE_ROLE_KEY }}
      # Ephemeral CI server is directly exposed (no reverse proxy); acknowledge
      # it explicitly so the production startup validator boots instead of
      # refusing. Never set this for real deployments.
      ALLOW_UNTRUSTED_CLIENT_IP: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run migrations (${{ matrix.backend }})
        run: npm run db:migrate
      - name: Seed deterministic test matrix
        run: node scripts/seed-deterministic-matrix.mjs
      - name: Seed admin
        run: npm run db:seed
      - name: Targeted database integration tests (native)
        if: matrix.backend == 'native'
        run: >-
          npx vitest run --no-file-parallelism
          tests/idempotency.int.test.ts
          tests/restore.int.test.ts
          tests/sum-hours.int.test.ts
          tests/password-change-race.int.test.ts
          tests/parity-tracer.test.ts
        env:
          CI: true
      - name: Database integration/concurrency tests (native)
        if: matrix.backend == 'native'
        run: npm run db:concurrency-test
        env:
          CI: true
      - name: Password-recovery database integration tests (native)
        if: matrix.backend == 'native'
        run: npm run db:password-recovery-test
        env:
          CI: true
      - name: Live Supabase RLS & RPC verification (supabase)
        if: matrix.backend == 'supabase'
        run: npx vitest run tests/supabase-live-rls.int.test.ts
        env:
          CI: true
      - name: Build Next.js (${{ matrix.backend }})
        run: npm run build
      - name: Performance regression budgets
        run: node scripts/benchmark-endpoints.mjs
      - name: Run Playwright E2E (${{ matrix.backend }})
        run: npm run e2e
        env:
          CI: true
      - name: Run Playwright Accessibility audit (${{ matrix.backend }})
        run: npm run a11y
        env:
          CI: true

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t vsis-timesheet:ci .

  mobile-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Mobile lint
        working-directory: mobile
        run: npm run lint
      - name: Mobile typecheck
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Mobile tests
        working-directory: mobile
        run: npm test
