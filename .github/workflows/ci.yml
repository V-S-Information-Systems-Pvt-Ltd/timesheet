name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: 'Coverage (Phase 1 acceptance: >60% on lib/ + app/actions.ts)'
        run: npm run test:coverage

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - mode: supabase
            env:
              NEXT_PUBLIC_BACKEND: supabase
              NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
              NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          - mode: native
            env:
              NEXT_PUBLIC_BACKEND: native
              DATABASE_URL: postgres://placeholder:placeholder@localhost:5432/vsis
              AUTH_SECRET: placeholder-secret-at-least-32-chars-long
    env: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck + build (${{ matrix.mode }})
        run: npm run build

  native-e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vsis
          POSTGRES_PASSWORD: vsispassword123
          POSTGRES_DB: vsis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://vsis:vsispassword123@localhost:5432/vsis_test
      TEST_DATABASE_URL: postgres://vsis:vsispassword123@localhost:5432/vsis_test
      AUTH_SECRET: test-auth-secret-key-at-least-32-bytes-long!
      ADMIN_EMAIL: admin@vsis.lk
      ADMIN_PASSWORD: AdminPassword123!
      E2E_EMAIL: admin@vsis.lk
      E2E_PASSWORD: AdminPassword123!
      NEXT_PUBLIC_BACKEND: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run migrations
        run: npm run db:migrate
      - name: Seed admin
        run: npm run db:seed
      - name: Database integration/concurrency tests
        run: npm run db:concurrency-test
        env:
          CI: true
      - name: Password-recovery database integration tests
        run: npm run db:password-recovery-test
        env:
          CI: true
      - name: Build Next.js
        run: npm run build
      - name: Run Playwright E2E
        # The pending-account navigation spec (e2e/pending-nav.spec.ts) is a
        # manual/local check: it needs a deactivated fixture account, which the
        # native seed does not create. It skips cleanly without
        # E2E_PENDING_EMAIL/E2E_PENDING_PASSWORD. See docs/security.
        run: npm run e2e
        env:
          CI: true

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t vsis-timesheet:ci .

  mobile-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Mobile lint
        working-directory: mobile
        run: npm run lint
      - name: Mobile typecheck
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Mobile tests
        working-directory: mobile
        run: npm test
