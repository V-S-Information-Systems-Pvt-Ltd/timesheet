name: Mobile Release Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Packaging mode'
        required: true
        default: 'signed'
        type: choice
        options:
          - signed
          - unsigned

env:
  RELEASE_MODE: ${{ github.event.inputs.release_mode || (startsWith(github.ref, 'refs/tags/v') && 'signed') || 'unsigned' }}

jobs:
  android-package:
    name: Android Release (APK / AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle
      - name: Install root dependencies
        run: npm ci
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Configure signing and build Android Release Package
        working-directory: mobile
        run: |
          if [ "$RELEASE_MODE" = "signed" ]; then
            echo "Packaging in SIGNED release mode..."
            if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
              echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/release.keystore
              export ANDROID_KEYSTORE_PATH="/tmp/release.keystore"
              export ANDROID_KEYSTORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
              export ANDROID_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
              export ANDROID_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
            else
              echo "Generating ephemeral CI release signing keystore..."
              keytool -genkey -v -keystore /tmp/release.keystore -alias vsis-release-key -keyalg RSA -keysize 2048 -validity 10000 -storepass ci-release-pass -keypass ci-release-pass -dname "CN=VSIS, OU=Mobile, O=VSIS, L=Colombo, C=LK"
              export ANDROID_KEYSTORE_PATH="/tmp/release.keystore"
              export ANDROID_KEYSTORE_PASSWORD="ci-release-pass"
              export ANDROID_KEY_ALIAS="vsis-release-key"
              export ANDROID_KEY_PASSWORD="ci-release-pass"
            fi
            npm run package:android
          else
            echo "Packaging in UNSIGNED mode..."
            npm run package:android:unsigned
          fi
      - name: Smoke test Android Package
        run: |
          test -s mobile/build/android/app-release.apk
          unzip -t mobile/build/android/app-release.apk
          echo "Android APK smoke verification passed."
      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-binaries
          path: mobile/build/android/
          if-no-files-found: error

  windows-msix:
    name: Windows MSIX Package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Build Windows MSIX Package
        working-directory: mobile
        shell: pwsh
        env:
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
        run: |
          if ($env:RELEASE_MODE -eq 'signed') {
            Write-Host "Building Windows package (Signed)..."
            if (-not $env:WINDOWS_SIGNING_PASSWORD) {
              Write-Host "::error::Signed Windows release requires WINDOWS_SIGNING_PASSWORD in GitHub secrets."
              exit 1
            }
            if ($env:WINDOWS_SIGNING_CERT_BASE64) {
              $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64)
              $certPath = Join-Path $env:RUNNER_TEMP "release.pfx"
              [System.IO.File]::WriteAllBytes($certPath, $certBytes)
              $env:WINDOWS_CERT_PATH = $certPath
            }
            npm run package:windows
          } else {
            Write-Host "Building Windows package (Unsigned)..."
            npm run package:windows:unsigned
          }
      - name: Smoke test Windows Package
        shell: pwsh
        run: |
          $binaries = Get-ChildItem -Path mobile/build/windows -Recurse -File | Where-Object { $_.Extension -in '.msix', '.msixbundle', '.appx', '.appxbundle', '.zip' }
          if (-not $binaries -or $binaries.Count -eq 0) {
            throw "Windows package smoke test failed: No valid MSIX or release binary found in mobile/build/windows"
          }
          foreach ($b in $binaries) {
            if ($b.Extension -in '.msix', '.appx') {
              Write-Host "Verifying package signature and structure for $($b.Name)..."
              $sig = Get-AuthenticodeSignature $b.FullName
              Write-Host "Package authenticode status: $($sig.Status)"
            }
          }
          Write-Host "Windows package smoke verification passed ($($binaries.Count) artifacts found)."
      - name: Upload Windows MSIX Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix-binaries
          path: mobile/build/windows/
          if-no-files-found: error

  ios-archive:
    name: iOS Release Archive
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile
      - name: Install root dependencies
        run: npm ci
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Install CocoaPods
        working-directory: mobile/ios
        run: bundle exec pod install
      - name: Install Apple Signing Certificate and Provisioning Profile
        if: env.RELEASE_MODE == 'signed'
        run: |
          if [ -n "${{ secrets.IOS_SIGNING_CERT_BASE64 }}" ] && [ -n "${{ secrets.IOS_SIGNING_CERT_PASSWORD }}" ]; then
            echo "Installing iOS signing certificate..."
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            KEYCHAIN_PASSWORD=temp-keychain-pass
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            CERT_PATH=$RUNNER_TEMP/certificate.p12
            echo "${{ secrets.IOS_SIGNING_CERT_BASE64 }}" | base64 --decode > "$CERT_PATH"
            security import "$CERT_PATH" -P "${{ secrets.IOS_SIGNING_CERT_PASSWORD }}" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

            if [ -n "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" ]; then
              mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
              echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/release.mobileprovision
            fi
            echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          else
            echo "::error::Signed iOS release requires IOS_SIGNING_CERT_BASE64, IOS_SIGNING_CERT_PASSWORD, and APPLE_TEAM_ID in GitHub secrets."
            exit 1
          fi
      - name: Build iOS Archive
        working-directory: mobile/ios
        run: |
          if [ "$RELEASE_MODE" = "signed" ]; then
            echo "Building signed iOS archive..."
            xcodebuild -workspace vsis_timesheet_mobile.xcworkspace \
              -scheme vsis_timesheet_mobile \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath ../build/ios/vsis_timesheet_mobile.xcarchive \
              DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
              clean archive
          else
            echo "Building unsigned iOS archive..."
            xcodebuild -workspace vsis_timesheet_mobile.xcworkspace \
              -scheme vsis_timesheet_mobile \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath ../build/ios/vsis_timesheet_mobile.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              clean archive
          fi
      - name: Smoke test iOS Archive
        run: |
          test -d mobile/build/ios/vsis_timesheet_mobile.xcarchive
          test -f mobile/build/ios/vsis_timesheet_mobile.xcarchive/Info.plist
          echo "iOS xcarchive smoke verification passed."
      - name: Upload iOS Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-binaries
          path: mobile/build/ios/
          if-no-files-found: error
