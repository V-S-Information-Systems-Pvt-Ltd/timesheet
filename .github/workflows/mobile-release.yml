name: Mobile Release Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Packaging mode'
        required: true
        default: 'unsigned'
        type: choice
        options:
          - unsigned
          - signed

jobs:
  android-package:
    name: Android Release (APK / AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle
      - name: Install root dependencies
        run: npm ci
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Build Android Release Package
        working-directory: mobile
        run: npm run package:android:unsigned
        env:
          UNSIGNED: 'true'
      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-binaries
          path: mobile/build/android/
          if-no-files-found: ignore

  windows-msix:
    name: Windows MSIX Package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Build Windows MSIX Package
        working-directory: mobile
        run: npm run package:windows:unsigned
        shell: pwsh
      - name: Upload Windows MSIX Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix-binaries
          path: mobile/build/windows/
          if-no-files-found: ignore

  ios-archive:
    name: iOS Release Archive
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile
      - name: Install root dependencies
        run: npm ci
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Install CocoaPods
        working-directory: mobile/ios
        run: bundle exec pod install
      - name: Build iOS Archive (Unsigned)
        working-directory: mobile/ios
        run: >-
          xcodebuild -workspace vsis_timesheet_mobile.xcworkspace
          -scheme vsis_timesheet_mobile
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath ../build/ios/vsis_timesheet_mobile.xcarchive
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
          clean archive
      - name: Upload iOS Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-binaries
          path: mobile/build/ios/
          if-no-files-found: ignore
