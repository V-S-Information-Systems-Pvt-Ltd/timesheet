# Mobile release builds (Android APK/AAB, Windows MSIX, iOS archive).
#
# Triggers and signing mode:
#   - push to main: Android and Windows only. Each platform builds signed when
#     all of its secrets below are set, otherwise unsigned (with a warning) so
#     the workflow still produces artifacts. iOS is skipped.
#   - push of a v* tag: all platforms, signed; missing secrets fail the job.
#     The signed Android and Windows builds are then attached to a draft
#     GitHub Release for the tag (assets replaced if the release exists).
#   - workflow_dispatch: all platforms, in the chosen signed/unsigned mode.
#
# Repository secrets:
#   ANDROID_KEYSTORE_BASE64      base64 of the release .keystore/.jks
#   ANDROID_KEYSTORE_PASSWORD    keystore password
#   ANDROID_KEY_ALIAS            key alias in the keystore
#   ANDROID_KEY_PASSWORD         key password
#   WINDOWS_SIGNING_CERT_BASE64  base64 of the production .pfx (its subject
#                                must match the Package.appxmanifest Publisher)
#   WINDOWS_SIGNING_PASSWORD     .pfx password
#   IOS_SIGNING_CERT_BASE64, IOS_SIGNING_CERT_PASSWORD,
#   IOS_PROVISIONING_PROFILE_BASE64, APPLE_TEAM_ID   (signed iOS only)
#
# Encode a file with `base64 -w0 file` (Linux) or
# `[Convert]::ToBase64String([IO.File]::ReadAllBytes('file'))` (PowerShell).
name: Mobile Release Packaging

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Packaging mode'
        required: true
        default: 'signed'
        type: choice
        options:
          - signed
          - unsigned

env:
  RELEASE_MODE: ${{ github.event.inputs.release_mode || (startsWith(github.ref, 'refs/tags/v') && 'signed') || 'unsigned' }}

jobs:
  android-package:
    name: Android Release (APK / AAB)
    runs-on: ubuntu-latest
    env:
      # Branch pushes sign only when every signing secret is present.
      RELEASE_MODE: ${{ github.event.inputs.release_mode || ((startsWith(github.ref, 'refs/tags/v') || (secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '')) && 'signed') || 'unsigned' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: gradle
      - name: Install root dependencies
        run: npm ci
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Configure signing and build Android Release Package
        working-directory: mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$RELEASE_MODE" = "signed" ]; then
            echo "Packaging in SIGNED release mode..."
            # A tagged release must be signed with the permanent production
            # key: artifacts signed with a freshly generated key can never
            # upgrade over each other through normal distribution channels.
            if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
              echo "::error::Signed Android release requires ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in GitHub secrets."
              exit 1
            fi
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
            export ANDROID_KEYSTORE_PATH="/tmp/release.keystore"
            npm run package:android
            (cd android && ./gradlew bundleRelease --no-daemon)
          else
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              echo "::warning::Android signing secrets are not set; building an unsigned release."
            fi
            echo "Packaging in UNSIGNED mode..."
            npm run package:android:unsigned
            (cd android && ./gradlew bundleRelease --no-daemon -Punsigned=true)
          fi
          cp android/app/build/outputs/bundle/release/app-release.aab build/android/
      - name: Smoke test Android Package
        run: |
          test -s mobile/build/android/app-release.apk
          unzip -t mobile/build/android/app-release.apk
          if [ "$RELEASE_MODE" = "signed" ]; then
            echo "Android APK smoke verification passed (signed artifact; proceeding to emulator launch)."
          else
            # Android cannot install an APK with no certificate: unsigned
            # artifacts are structure-tested only. This is NOT launch evidence.
            echo "Android APK smoke verification passed (unsigned artifact; structure validation only, no install/launch)."
          fi
      # Hosted ubuntu runners don't grant the runner user /dev/kvm; without it the emulator
      # boots unaccelerated and adb never sees the device online.
      - name: Enable KVM for the Android emulator
        if: env.RELEASE_MODE == 'signed'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch Android APK
        # An unsigned release APK has no certificate and Android rejects its
        # installation, so emulator install/launch runs for signed mode only.
        if: env.RELEASE_MODE == 'signed'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          # The runner executes each script line as its own `sh -c`, so a multi-line loop
          # breaks apart ("expecting done"); the launch check must stay on one line.
          script: |
            adb install -r mobile/build/android/app-release.apk
            adb shell am start -n com.vsis.timesheet/.MainActivity
            for attempt in $(seq 1 20); do if adb shell pidof com.vsis.timesheet | grep -q '[0-9]'; then echo "Android packaged launch smoke verification passed."; exit 0; fi; sleep 1; done; echo "Android packaged launch smoke verification failed: process did not remain running."; adb logcat -d -t 200; exit 1
      - name: Upload Android Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-binaries
          path: mobile/build/android/
          if-no-files-found: error

  windows-msix:
    name: Windows MSIX Package
    runs-on: windows-latest
    env:
      # Branch pushes sign only when the certificate and its password are present.
      RELEASE_MODE: ${{ github.event.inputs.release_mode || ((startsWith(github.ref, 'refs/tags/v') || (secrets.WINDOWS_SIGNING_CERT_BASE64 != '' && secrets.WINDOWS_SIGNING_PASSWORD != '')) && 'signed') || 'unsigned' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      # react-native-windows (new arch) pins WindowsTargetPlatformVersion to 10.0.22621.0,
      # which the windows-latest image (VS 18) does not ship; add it through the VS installer.
      - name: Install Windows SDK 10.0.22621
        shell: pwsh
        run: |
          $sdkInclude = "${env:ProgramFiles(x86)}\Windows Kits\10\Include\10.0.22621.0"
          if (Test-Path $sdkInclude) {
            Write-Host "Windows SDK 10.0.22621.0 already installed."
            exit 0
          }
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vsPath = & "$installer\vswhere.exe" -latest -products * -property installationPath
          $proc = Start-Process -FilePath "$installer\vs_installer.exe" -Wait -PassThru -ArgumentList @(
            'modify', '--installPath', "`"$vsPath`"",
            '--add', 'Microsoft.VisualStudio.Component.Windows11SDK.22621',
            '--quiet', '--norestart', '--nocache'
          )
          # 3010 = success, reboot required (not needed for building).
          if ($proc.ExitCode -notin 0, 3010) {
            Write-Host "::error::VS installer exited with $($proc.ExitCode) while adding Windows SDK 10.0.22621."
            exit 1
          }
          if (-not (Test-Path $sdkInclude)) {
            Write-Host "::error::Windows SDK 10.0.22621.0 is still missing after install."
            exit 1
          }
      - name: Build Windows MSIX Package
        working-directory: mobile
        shell: pwsh
        env:
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
        run: |
          if ($env:RELEASE_MODE -eq 'signed') {
            Write-Host "Building Windows package (Signed)..."
            if (-not $env:WINDOWS_SIGNING_PASSWORD -or -not $env:WINDOWS_SIGNING_CERT_BASE64) {
              Write-Host "::error::Signed Windows release requires WINDOWS_SIGNING_PASSWORD and WINDOWS_SIGNING_CERT_BASE64 in GitHub secrets."
              exit 1
            }
            try {
              $certBytes = [System.Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64)
              $certPath = Join-Path $env:RUNNER_TEMP "release.pfx"
              [System.IO.File]::WriteAllBytes($certPath, $certBytes)
              $env:WINDOWS_CERT_PATH = $certPath
              "WINDOWS_CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            } catch {
              Write-Host "::error::WINDOWS_SIGNING_CERT_BASE64 is not valid base64."
              exit 1
            }
            npm run package:windows
          } else {
            if ($env:GITHUB_EVENT_NAME -eq 'push') {
              Write-Host "::warning::Windows signing secrets are not set; building an unsigned package."
            }
            Write-Host "Building Windows package (Unsigned)..."
            npm run package:windows:unsigned
          }
      - name: Smoke test Windows Package
        shell: pwsh
        env:
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $binaries = Get-ChildItem -Path mobile/build/windows -Recurse -File | Where-Object { $_.Extension -in '.msix', '.msixbundle', '.appx', '.appxbundle', '.zip' }
          if (-not $binaries -or $binaries.Count -eq 0) {
            throw "Windows package smoke test failed: No valid MSIX or release binary found in mobile/build/windows"
          }
          if ($env:RELEASE_MODE -eq 'signed') {
            if (-not $env:WINDOWS_CERT_PATH -or -not (Test-Path -LiteralPath $env:WINDOWS_CERT_PATH)) {
              throw "Windows package smoke test cannot verify or launch the signed artifact: permanent signing certificate is unavailable."
            }
            if (-not $env:WINDOWS_SIGNING_PASSWORD) {
              throw "Windows package smoke test cannot verify or launch the signed artifact: signing password is unavailable."
            }
            $securePassword = ConvertTo-SecureString $env:WINDOWS_SIGNING_PASSWORD -AsPlainText -Force
            Import-PfxCertificate -FilePath $env:WINDOWS_CERT_PATH -Password $securePassword -CertStoreLocation Cert:\CurrentUser\TrustedPeople -ErrorAction Stop | Out-Null
            # The signing cert chains to a private root CA bundled in the PFX. Trust that root
            # (public cert only) so Authenticode reports Valid and Add-AppxPackage accepts the
            # package. LocalMachine\Root avoids the confirmation dialog CurrentUser\Root raises.
            $pfxChain = [System.Security.Cryptography.X509Certificates.X509Certificate2Collection]::new()
            $pfxChain.Import($env:WINDOWS_CERT_PATH, $env:WINDOWS_SIGNING_PASSWORD, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::DefaultKeySet)
            $rootCerts = @($pfxChain | Where-Object { $_.Subject -eq $_.Issuer })
            if ($rootCerts.Count -gt 0) {
              $rootStore = [System.Security.Cryptography.X509Certificates.X509Store]::new('Root', 'LocalMachine')
              $rootStore.Open('ReadWrite')
              foreach ($root in $rootCerts) {
                $rootStore.Add([System.Security.Cryptography.X509Certificates.X509Certificate2]::new($root.RawData))
                Write-Host "Trusted signing root CA: $($root.Subject)"
              }
              $rootStore.Close()
            }
          }
          $failures = @()
          foreach ($b in $binaries) {
            if ($b.Extension -in '.msix', '.appx') {
              Write-Host "Verifying package signature and structure for $($b.Name)..."
              $sig = Get-AuthenticodeSignature $b.FullName
              Write-Host "Package authenticode status: $($sig.Status)"
              if ($env:RELEASE_MODE -eq 'signed' -and $sig.Status -ne 'Valid') {
                $failures += "$($b.Name): authenticode status '$($sig.Status)' (expected Valid for a signed release)"
              }
            }
          }
          if ($failures.Count -gt 0) {
            throw "Windows package smoke test failed: unsigned or invalid packages in a signed release -> $($failures -join '; ')"
          }
          if ($env:RELEASE_MODE -eq 'signed') {
            # Only our app package: the Dependencies\<arch> runtimes (VCLibs, WindowsAppRuntime)
            # sort ahead of it by name and include ARM64/x86 builds the x64 runner cannot install.
            $package = $binaries |
              Where-Object { $_.Extension -in '.msixbundle', '.msix', '.appxbundle', '.appx' -and $_.Name -like 'VsisTimesheetMobile.Package_*' } |
              Sort-Object @{ Expression = { if ($_.Extension -in '.msixbundle', '.appxbundle') { 0 } else { 1 } } }, Name |
              Select-Object -First 1
            if (-not $package) {
              throw "Windows packaged launch smoke test failed: no installable AppX/MSIX artifact found."
            }
            $dependencyDirectory = Join-Path $package.Directory.FullName 'Dependencies\x64'
            $dependencies = @()
            if (Test-Path -LiteralPath $dependencyDirectory) {
              $dependencies = @(Get-ChildItem -LiteralPath $dependencyDirectory -File | Where-Object { $_.Extension -in '.appx', '.msix' } | Select-Object -ExpandProperty FullName)
            }
            if ($dependencies.Count -gt 0) {
              Add-AppxPackage -Path $package.FullName -DependencyPath $dependencies -ForceApplicationShutdown -ErrorAction Stop
            } else {
              Add-AppxPackage -Path $package.FullName -ForceApplicationShutdown -ErrorAction Stop
            }
            $installed = Get-AppxPackage -Name 'VsisTimesheetMobile' | Select-Object -First 1
            if (-not $installed) {
              throw "Windows packaged launch smoke test failed: package was not installed."
            }
            try {
              Start-Process -FilePath explorer.exe -ArgumentList "shell:AppsFolder\$($installed.PackageFamilyName)!App"
              $running = $false
              for ($attempt = 0; $attempt -lt 20; $attempt++) {
                if (Get-Process -Name 'VsisTimesheetMobile' -ErrorAction SilentlyContinue) {
                  $running = $true
                  break
                }
                Start-Sleep -Seconds 1
              }
              if (-not $running) {
                throw "Windows packaged launch smoke test failed: application process did not remain running."
              }
            } finally {
              Get-Process -Name 'VsisTimesheetMobile' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
              Remove-AppxPackage -Package $installed.PackageFullName -ErrorAction SilentlyContinue
            }
            Write-Host "Windows packaged install and launch smoke verification passed."
          } else {
            Write-Host "Unsigned Windows package launch is intentionally not attempted; MSIX identity is unavailable in unsigned mode."
          }
          Write-Host "Windows package smoke verification passed ($($binaries.Count) artifacts found)."
      - name: Upload Windows MSIX Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-msix-binaries
          path: mobile/build/windows/
          if-no-files-found: error

  ios-archive:
    name: iOS Release Archive
    # main pushes build Android and Windows only; iOS runs for tags and manual runs.
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    # React Native 0.84 requires Xcode >= 16.1; macos-14 ships 15.4.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile
      - name: Install root dependencies
        run: npm ci
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Install CocoaPods
        working-directory: mobile/ios
        run: bundle exec pod install
      - name: Install Apple Signing Certificate and Provisioning Profile
        if: env.RELEASE_MODE == 'signed'
        env:
          IOS_SIGNING_CERT_BASE64: ${{ secrets.IOS_SIGNING_CERT_BASE64 }}
          IOS_SIGNING_CERT_PASSWORD: ${{ secrets.IOS_SIGNING_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Signed releases need all four inputs; a missing profile or team ID
          # would let xcodebuild run without a discoverable signing identity.
          if [ -z "$IOS_SIGNING_CERT_BASE64" ] || [ -z "$IOS_SIGNING_CERT_PASSWORD" ] || [ -z "$IOS_PROVISIONING_PROFILE_BASE64" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Signed iOS release requires IOS_SIGNING_CERT_BASE64, IOS_SIGNING_CERT_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64 and APPLE_TEAM_ID in GitHub secrets."
            exit 1
          fi

          echo "Installing iOS signing certificate and provisioning profile..."
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=temp-keychain-pass
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "$IOS_SIGNING_CERT_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -P "$IOS_SIGNING_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # xcodebuild can only use identities from keychains on the search list.
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')

          PROFILES_DIR=~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p "$PROFILES_DIR"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILES_DIR/release.mobileprovision"

          echo "IOS_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
      - name: Build iOS Archive
        working-directory: mobile/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_KEYCHAIN_PATH: ${{ env.IOS_KEYCHAIN_PATH }}
        run: |
          if [ "$RELEASE_MODE" = "signed" ]; then
            echo "Building signed iOS archive..."
            xcodebuild -workspace mobile.xcworkspace \
              -scheme mobile \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath ../build/ios/vsis_timesheet_mobile.xcarchive \
              DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
              OTHER_CODE_SIGN_FLAGS="--keychain $IOS_KEYCHAIN_PATH" \
              clean archive
          else
            echo "Building unsigned iOS archive..."
            xcodebuild -workspace mobile.xcworkspace \
              -scheme mobile \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath ../build/ios/vsis_timesheet_mobile.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              clean archive
          fi
      - name: Smoke test iOS Archive
        run: |
          test -d mobile/build/ios/vsis_timesheet_mobile.xcarchive
          test -f mobile/build/ios/vsis_timesheet_mobile.xcarchive/Info.plist
          echo "iOS xcarchive smoke verification passed."
      - name: Build and launch iOS Simulator package
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available | sed -n 's/.*(\([0-9A-F-]*\)) (Shutdown).*/\1/p' | head -n 1)
          if [ -z "$DEVICE_ID" ]; then
            echo "::error::No available iOS Simulator device was found."
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -workspace mobile.xcworkspace \
            -scheme mobile \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath ../build/ios/simulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
          APP_PATH=$(find ../build/ios/simulator/Build/Products -type d -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No iOS Simulator .app was produced."
            exit 1
          fi
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          xcrun simctl launch "$DEVICE_ID" com.vsis.timesheetmobile
          xcrun simctl get_app_container "$DEVICE_ID" com.vsis.timesheetmobile app
          xcrun simctl terminate "$DEVICE_ID" com.vsis.timesheetmobile || true
          xcrun simctl shutdown "$DEVICE_ID" || true
          echo "iOS packaged simulator install and launch smoke verification passed."
      - name: Upload iOS Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-archive-binaries
          path: mobile/build/ios/
          if-no-files-found: error

  github-release:
    name: Attach Builds to GitHub Release
    # Tag builds only. iOS is left out: its signing secrets are not set yet.
    if: github.ref_type == 'tag'
    needs: [android-package, windows-msix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            mobile/android/app/build.gradle
            mobile/windows/VsisTimesheetMobile.Package/Package.appxmanifest
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          name: android-release-binaries
          path: artifacts/android
      - uses: actions/download-artifact@v4
        with:
          name: windows-msix-binaries
          path: artifacts/windows
      - name: Collect release assets
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p release
          cp artifacts/android/app-release.apk "release/vsis-timesheet-v$ver.apk"
          cp artifacts/android/app-release.aab "release/vsis-timesheet-v$ver.aab"

          mapfile -t msix < <(find artifacts/windows -maxdepth 1 -type f -name 'VsisTimesheetMobile.Package_*.msix')
          if [ "${#msix[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one VsisTimesheetMobile.Package_*.msix, found ${#msix[@]}."
            exit 1
          fi
          cp "${msix[0]}" "release/vsis-timesheet-v$ver-x64.msix"
          zip -j "release/vsis-timesheet-v$ver-x64-dependencies.zip" artifacts/windows/Dependencies/x64/*

          # Public root CA only: -nokeys keeps the private key out, and the
          # DER re-encode below can only ever emit a certificate.
          pfx="$RUNNER_TEMP/release.pfx"
          echo "$WINDOWS_SIGNING_CERT_BASE64" | base64 --decode > "$pfx"
          openssl pkcs12 -in "$pfx" -nokeys -passin env:WINDOWS_SIGNING_PASSWORD -out "$RUNNER_TEMP/chain.pem" 2>/dev/null ||
            openssl pkcs12 -legacy -in "$pfx" -nokeys -passin env:WINDOWS_SIGNING_PASSWORD -out "$RUNNER_TEMP/chain.pem"
          rm -f "$pfx"
          mkdir -p "$RUNNER_TEMP/chain"
          awk '/-----BEGIN CERTIFICATE-----/{n++; out=ENVIRON["RUNNER_TEMP"] "/chain/" n ".pem"} out{print > out} /-----END CERTIFICATE-----/{out=""}' "$RUNNER_TEMP/chain.pem"
          root=""
          for c in "$RUNNER_TEMP"/chain/*.pem; do
            if [ "$(openssl x509 -in "$c" -noout -subject -nameopt RFC2253 | sed 's/^subject=//')" = "$(openssl x509 -in "$c" -noout -issuer -nameopt RFC2253 | sed 's/^issuer=//')" ]; then
              root="$c"
            fi
          done
          if [ -z "$root" ]; then
            echo "::error::No self-signed root CA found in the Windows signing PFX."
            exit 1
          fi
          openssl x509 -in "$root" -outform der -out release/VSIS-Internal-Signing-Root-CA.cer
          openssl x509 -in "$root" -noout -subject -fingerprint -sha256

          {
            echo "VER=$ver"
            echo "VERSION_CODE=$(sed -n 's/^ *versionCode \([0-9]*\).*/\1/p' mobile/android/app/build.gradle)"
            echo "MSIX_VERSION=$(grep -o 'Version="[0-9.]*"' mobile/windows/VsisTimesheetMobile.Package/Package.appxmanifest | head -n 1 | cut -d'"' -f2)"
          } >> "$GITHUB_ENV"
          ls -l release
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Existing release (draft or published): replace the assets, keep the notes.
            gh release upload "$tag" release/* --clobber
            exit 0
          fi
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## VSIS Timesheet v$VER

          ### Mobile app
          - _Describe the changes in this release before publishing._

          ### Downloads

          | File | What it is |
          |---|---|
          | \`vsis-timesheet-v$VER.apk\` | Android app, for direct install (versionCode $VERSION_CODE) |
          | \`vsis-timesheet-v$VER.aab\` | Android App Bundle, for Play Store upload |
          | \`vsis-timesheet-v$VER-x64.msix\` | Windows desktop app, x64 ($MSIX_VERSION) |
          | \`vsis-timesheet-v$VER-x64-dependencies.zip\` | VCLibs and Windows App Runtime packages the MSIX needs, if they're not already installed |
          | \`VSIS-Internal-Signing-Root-CA.cer\` | Public root certificate that the Windows package is signed under |

          All builds are signed. CI installs and launches the Android and Windows builds before upload.

          ### Installing on Windows
          The MSIX is signed with the VSIS internal certificate, so Windows has to trust its root first. This is needed once per machine.

          1. Open PowerShell **as Administrator** and trust the root certificate:
             \`\`\`powershell
             Import-Certificate -FilePath .\VSIS-Internal-Signing-Root-CA.cer -CertStoreLocation Cert:\LocalMachine\Root
             \`\`\`
          2. Install the app. If Windows reports missing dependencies, extract the dependencies zip first and pass its packages in:
             \`\`\`powershell
             Add-AppxPackage .\vsis-timesheet-v$VER-x64.msix
             # or, with dependencies:
             Add-AppxPackage .\vsis-timesheet-v$VER-x64.msix -DependencyPath (Get-ChildItem .\vsis-timesheet-v$VER-x64-dependencies\*.appx, .\vsis-timesheet-v$VER-x64-dependencies\*.msix).FullName
             \`\`\`

          ### iOS
          No iOS build is attached to this release, because iOS signing isn't set up yet.
          NOTES
          gh release create "$tag" release/* --draft --verify-tag --title "VSIS Timesheet v$VER" --notes-file "$RUNNER_TEMP/notes.md"
