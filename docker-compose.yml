# Local cloud-native run (PostgreSQL). Password recovery email
# delivery is opt-in; add APP_BASE_URL and SMTP_* settings for a mail provider
# or local Mailpit instance.

services:
  app:
    build: .
    environment:
      MAINTENANCE_MODE: "${MAINTENANCE_MODE:-false}"
      DATABASE_URL: postgres://vsis:vsis@db:5432/vsis
      # Required: generate each with `openssl rand -base64 48`. The server
      # refuses to start on a missing, short or placeholder secret.
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET to a long random value}
      RATE_LIMIT_SUBJECT_SECRET: ${RATE_LIMIT_SUBJECT_SECRET:?set RATE_LIMIT_SUBJECT_SECRET to a long random value}
      # Used by the one-off seed below to create the first admin.
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: change-me
      # Direct port exposure without reverse proxy requires explicit local fallback acknowledgment:
      ALLOW_UNTRUSTED_CLIENT_IP: "true"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vsis
      POSTGRES_PASSWORD: vsis
      POSTGRES_DB: vsis
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsis -d vsis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
