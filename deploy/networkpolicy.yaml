# Allow ingress to the app only from the cluster ingress controller and the
# in-namespace cleanup CronJob. Without a `from:` clause any pod in the cluster
# could reach port 3000 and spoof X-Forwarded-For past the trusted proxy hop.
# Set the namespace name to wherever your ingress controller runs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vsis-timesheet
spec:
  podSelector:
    matchLabels:
      app: vsis-timesheet
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: vsis-timesheet-cleanup
      ports:
        - port: 3000
