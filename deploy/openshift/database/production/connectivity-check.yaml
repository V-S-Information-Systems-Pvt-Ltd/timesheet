apiVersion: batch/v1
kind: Job
metadata:
  name: timesheet-postgres-connectivity-check
  namespace: timesheet-vsis
spec:
  ttlSecondsAfterFinished: 3600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: psql
          image: ghcr.io/cloudnative-pg/postgresql:17-standard-trixie@sha256:26dcad0b6f2dfe70136b7697b839326be56848706596763d6df7e67ba6d9083d
          command:
            - psql
            - -Atc
            - SELECT current_database(), current_user, (SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid())
          env:
            - name: PGHOST
              value: timesheet-postgres-rw.timesheet-vsis.svc
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: timesheet-postgres-app
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: timesheet-postgres-app
                  key: password
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: timesheet-postgres-app
                  key: dbname
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /ca/ca.crt
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: ca
              mountPath: /ca
              readOnly: true
      volumes:
        - name: ca
          secret:
            secretName: timesheet-postgres-ca
            items:
              - key: ca.crt
                path: ca.crt
