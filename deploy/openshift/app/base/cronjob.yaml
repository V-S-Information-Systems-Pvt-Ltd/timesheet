apiVersion: batch/v1
kind: CronJob
metadata:
  name: vsis-timesheet-cleanup
  labels:
    app.kubernetes.io/name: vsis-timesheet-cleanup
    app.kubernetes.io/part-of: vsis-timesheet
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: vsis-timesheet-cleanup
            app.kubernetes.io/part-of: vsis-timesheet
        spec:
          serviceAccountName: vsis-timesheet
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: vsis-timesheet:crc
              imagePullPolicy: Always
              command: ["node", "--input-type=module", "-e"]
              args:
                - |
                  const secret = process.env.CRON_SECRET;
                  if (!secret) { console.error('CRON_SECRET is not configured'); process.exit(1); }
                  const response = await fetch('http://vsis-timesheet/api/v1/cron/cleanup', {
                    method: 'POST',
                    headers: { authorization: `Bearer ${secret}` },
                  });
                  if (!response.ok) { console.error(`Cleanup failed with HTTP ${response.status}`); process.exit(1); }
              envFrom:
                - configMapRef:
                    name: vsis-timesheet-config
                - secretRef:
                    name: vsis-timesheet-secret
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
