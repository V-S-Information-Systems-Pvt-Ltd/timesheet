apiVersion: batch/v1
kind: Job
metadata:
  name: vsis-timesheet-smoke-verify
  labels:
    app.kubernetes.io/name: vsis-timesheet-smoke-verify
    app.kubernetes.io/part-of: vsis-timesheet
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vsis-timesheet-smoke-verify
        app.kubernetes.io/part-of: vsis-timesheet
    spec:
      serviceAccountName: vsis-timesheet
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: image-registry.openshift-image-registry.svc:5000/timesheet-test/vsis-timesheet:crc
          imagePullPolicy: IfNotPresent
          command: ["node", "--input-type=module", "-e"]
          args:
            - |
              const base = 'http://vsis-timesheet';
              const marker = 'CRC OpenShift persistence smoke';
              async function request(path, { method = 'GET', body, cookie } = {}) {
                const headers = { accept: 'application/json' };
                if (body !== undefined) headers['content-type'] = 'application/json';
                if (cookie) headers.cookie = cookie;
                if (!['GET', 'HEAD'].includes(method)) headers.origin = base;
                const response = await fetch(`${base}${path}`, {
                  method,
                  headers,
                  ...(body !== undefined ? { body: JSON.stringify(body) } : {}),
                });
                const text = await response.text();
                if (!response.ok) throw new Error(`${method} ${path} failed with HTTP ${response.status}: ${text.slice(0, 300)}`);
                return { response, data: text ? JSON.parse(text) : null };
              }
              const login = await request('/api/v1/auth/browser/login', {
                method: 'POST',
                body: { email: process.env.ADMIN_EMAIL, password: process.env.ADMIN_PASSWORD },
              });
              const setCookie = login.response.headers.get('set-cookie');
              if (!setCookie) throw new Error('Login succeeded without a session cookie.');
              const cookie = setCookie.split(';', 1)[0];
              await request('/api/v1/auth/browser/me', { cookie });
              const rows = (await request('/api/v1/timesheets?limit=100', { cookie })).data?.data?.rows ?? [];
              const entry = rows.find((row) => row.work_done === marker);
              if (!entry?.id) throw new Error('Smoke entry did not survive the application restart.');
              await request(`/api/v1/timesheets/${encodeURIComponent(entry.id)}`, { method: 'DELETE', cookie });
              const remaining = (await request('/api/v1/timesheets?limit=100', { cookie })).data?.data?.rows ?? [];
              if (remaining.some((row) => row.work_done === marker)) throw new Error('Smoke entry cleanup failed.');
              console.log('Persistence-after-restart and cleanup smoke passed.');
          envFrom:
            - secretRef:
                name: vsis-timesheet-bootstrap
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
