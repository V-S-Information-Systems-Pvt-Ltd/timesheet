apiVersion: batch/v1
kind: Job
metadata:
  name: vsis-timesheet-seed
  labels:
    app.kubernetes.io/name: vsis-timesheet-seed
    app.kubernetes.io/part-of: vsis-timesheet
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vsis-timesheet-seed
        app.kubernetes.io/part-of: vsis-timesheet
    spec:
      serviceAccountName: vsis-timesheet
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: image-registry.openshift-image-registry.svc:5000/timesheet-test/vsis-timesheet:crc
          imagePullPolicy: Always
          command: ["node", "db/seed.mjs"]
          envFrom:
            - configMapRef:
                name: vsis-timesheet-config
            - secretRef:
                name: vsis-timesheet-secret
            - secretRef:
                name: vsis-timesheet-bootstrap
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
