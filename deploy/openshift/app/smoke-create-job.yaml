apiVersion: batch/v1
kind: Job
metadata:
  name: vsis-timesheet-smoke-create
  labels:
    app.kubernetes.io/name: vsis-timesheet-smoke-create
    app.kubernetes.io/part-of: vsis-timesheet
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vsis-timesheet-smoke-create
        app.kubernetes.io/part-of: vsis-timesheet
    spec:
      serviceAccountName: vsis-timesheet
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: image-registry.openshift-image-registry.svc:5000/timesheet-test/vsis-timesheet:crc
          imagePullPolicy: IfNotPresent
          command: ["node", "--input-type=module", "-e"]
          args:
            - |
              const base = 'http://vsis-timesheet';
              const marker = 'CRC OpenShift persistence smoke';
              async function request(path, { method = 'GET', body, cookie } = {}) {
                const headers = { accept: 'application/json' };
                if (body !== undefined) headers['content-type'] = 'application/json';
                if (cookie) headers.cookie = cookie;
                if (!['GET', 'HEAD'].includes(method)) headers.origin = base;
                const response = await fetch(`${base}${path}`, {
                  method,
                  headers,
                  ...(body !== undefined ? { body: JSON.stringify(body) } : {}),
                });
                const text = await response.text();
                let data = null;
                if (text) {
                  try { data = JSON.parse(text); } catch { data = text; }
                }
                if (!response.ok) throw new Error(`${method} ${path} failed with HTTP ${response.status}: ${String(text).slice(0, 300)}`);
                return { response, data };
              }
              const login = await request('/api/v1/auth/browser/login', {
                method: 'POST',
                body: { email: process.env.ADMIN_EMAIL, password: process.env.ADMIN_PASSWORD },
              });
              const setCookie = login.response.headers.get('set-cookie');
              if (!setCookie) throw new Error('Login succeeded without a session cookie.');
              const cookie = setCookie.split(';', 1)[0];
              await request('/api/v1/auth/browser/me', { cookie });
              const reference = (await request('/api/v1/reference', { cookie })).data?.data;
              const project = reference?.projects?.[0];
              const activityType = reference?.activityTypes?.[0];
              if (!project?.id || !activityType?.id) throw new Error('Reference data is missing a project or activity type.');
              // Match the application's `todayISO()` contract: calendar fields
              // from the process-local Date rather than UTC string slicing.
              const now = new Date();
              const logDate = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
              const before = (await request('/api/v1/timesheets?limit=100', { cookie })).data?.data?.rows ?? [];
              for (const row of before.filter((entry) => entry.work_done === marker)) {
                await request(`/api/v1/timesheets/${encodeURIComponent(row.id)}`, { method: 'DELETE', cookie });
              }
              await request('/api/v1/timesheets', {
                method: 'POST',
                cookie,
                body: {
                  projectId: project.id,
                  activityTypeId: activityType.id,
                  hoursWorked: 1,
                  workDone: marker,
                  logDate,
                },
              });
              const after = (await request('/api/v1/timesheets?limit=100', { cookie })).data?.data?.rows ?? [];
              if (!after.some((entry) => entry.work_done === marker)) throw new Error('Created smoke entry was not returned by the API.');
              console.log('Authenticated create/read smoke passed.');
          envFrom:
            - secretRef:
                name: vsis-timesheet-bootstrap
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
