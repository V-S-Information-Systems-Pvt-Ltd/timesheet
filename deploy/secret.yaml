# Secret configuration. Replace the CHANGE_ME values (ideally via a sealed-secret
# or your platform's secret store rather than committing real values).
apiVersion: v1
kind: Secret
metadata:
  name: vsis-timesheet-secret
type: Opaque
stringData:
  # PostgreSQL connection string for the native backend.
  DATABASE_URL: "postgres://vsis:CHANGE_ME@postgres:5432/vsis"
  # Long random string (>= 32 bytes) used to sign session cookies.
  AUTH_SECRET: "CHANGE_ME-to-a-long-random-string"
  # Long random string (>= 32 bytes) used to HMAC rate-limit subjects (emails,
  # IPs) before they are persisted. Required.
  RATE_LIMIT_SUBJECT_SECRET: "CHANGE_ME-to-a-long-random-string"
  # Shared secret for POST /api/v1/cron/cleanup. Required: the endpoint returns
  # 503 when this is unset and 403 on mismatch.
  CRON_SECRET: "CHANGE_ME-to-a-long-random-string"
  # First-admin bootstrap (used by `node db/seed.mjs`).
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "CHANGE_ME"
  # Password recovery SMTP settings. Replace with provider-specific values.
  APP_BASE_URL: "https://timesheet.example.com"
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"
  SMTP_USER: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME"
  SMTP_FROM: "VSIS Timesheet <no-reply@example.com>"
