# Secret configuration. Replace the CHANGE_ME values (ideally via a sealed-secret
# or your platform's secret store rather than committing real values).
apiVersion: v1
kind: Secret
metadata:
  name: vsis-timesheet-secret
type: Opaque
stringData:
  # PostgreSQL connection string for the native backend.
  DATABASE_URL: "postgres://vsis:CHANGE_ME@postgres:5432/vsis"
  # Long random string (>= 32 bytes) used to sign session cookies.
  AUTH_SECRET: "CHANGE_ME-to-a-long-random-string"
  # First-admin bootstrap (used by `node db/seed.mjs`).
  ADMIN_EMAIL: "admin@example.com"
  ADMIN_PASSWORD: "CHANGE_ME"
