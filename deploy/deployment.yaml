# Application deployment. Works on Rancher (plain Kubernetes) and OpenShift.
# OpenShift ignores the Dockerfile USER and runs the pod as an arbitrary UID;
# the image is non-root and does not write to the filesystem at runtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vsis-timesheet
  labels:
    app: vsis-timesheet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vsis-timesheet
  template:
    metadata:
      labels:
        app: vsis-timesheet
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: vsis-timesheet:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: vsis-timesheet-config
            - secretRef:
                name: vsis-timesheet-secret
          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
