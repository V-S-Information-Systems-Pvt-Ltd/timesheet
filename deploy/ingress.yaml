# Ingress for Rancher / nginx-ingress. Adjust the host to your environment.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vsis-timesheet
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - host: timesheet.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vsis-timesheet
                port:
                  number: 80
