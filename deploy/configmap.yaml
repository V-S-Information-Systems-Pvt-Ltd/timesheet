# Non-secret runtime configuration for the VSIS Timesheet app.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vsis-timesheet-config
data:
  # The cloud-native image is built with native mode baked in (build-time).
  # This is also set at runtime for the server process.
  NEXT_PUBLIC_BACKEND: "native"
  # Trusted reverse-proxy hops in front of the pod. "1" matches both the nginx
  # Ingress (deploy/ingress.yaml) and the OpenShift Route (deploy/route.yaml).
  # Raise to "2" when an external CDN/WAF (e.g. Cloudflare) fronts the ingress.
  # Without this, getClientIp() fails closed to the shared "direct-client" key
  # and every unproxied request competes for one rate-limit bucket.
  TRUSTED_PROXY_HOPS: "1"
