<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VSIS Timesheet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 420px;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        background: #ffffff;
        padding: 28px;
        box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
      }
      code {
        background: #f1f5f9;
        border-radius: 6px;
        padding: 2px 6px;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>VSIS Timesheet</h1>
      <p>
        The app loads the deployed web app, but no server URL is configured in
        this build.
      </p>
      <p>
        Rebuild with <code>APP_URL=https://&lt;deployed-url&gt;</code> set (see
        <code>mobile/README.md</code>).
      </p>
    </div>
  </body>
</html>
