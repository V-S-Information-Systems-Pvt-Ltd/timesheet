<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="vsis-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5252D" />
      <stop offset="100%" stop-color="#C4161C" />
    </linearGradient>
    <linearGradient id="vsis-charcoal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555C62" />
      <stop offset="100%" stop-color="#3A3F44" />
    </linearGradient>
    <linearGradient id="vsis-text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60676D" />
      <stop offset="48%" stop-color="#4E555B" />
      <stop offset="50%" stop-color="#3B4147" />
      <stop offset="100%" stop-color="#30353A" />
    </linearGradient>
  </defs>

